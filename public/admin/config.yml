# Decap CMS configuration — KK's editing surface.
#
# Each collection here mirrors a YAML file in /content. Fields mirror
# the Zod schemas in src/lib/schema.ts. Mismatches between this config
# and the schemas fail closed: an invalid Decap commit causes the
# prebuild validation script to error, which fails the CF Pages build,
# which means the bad edit never reaches production.
#
# OAuth: GitHub backend. The OAuth proxy runs as two Pages Functions
# on the same project: /oauth/auth and /oauth/callback. Decap opens
# the popup at `${base_url}/${auth_endpoint}` and the popup
# completes the flow at `${base_url}/oauth/callback`.

backend:
  name: github
  repo: the-obelisk-studio/marketing
  branch: main
  base_url: https://www.theobeliskstudio.com
  auth_endpoint: oauth/auth

# Where Decap stores uploaded images. Served from /uploads/foo.jpg in
# the deployed site.
media_folder: public/uploads
public_folder: /uploads

# Editor experience.
editor:
  preview: false
site_url: https://www.theobeliskstudio.com
display_url: https://www.theobeliskstudio.com

# ── Collections ─────────────────────────────────────────────────────
collections:

  # ── Shared (nav + footer) ────────────────────────────────────────
  - name: shared
    label: "Shared · Nav & Footer"
    files:
      - name: shared
        label: "Site Shared"
        file: content/shared.yml
        format: yaml
        fields:
          - { name: navLinks, label: Nav links, widget: list, fields: [
              { name: label, label: Label, widget: string },
              { name: href, label: Href, widget: string },
            ] }
          - name: footer
            label: Footer
            widget: object
            fields:
              - { name: tagline, label: Tagline, widget: string, required: false }
              - { name: contactEmail, label: Contact email, widget: string, required: false }
              - name: columns
                label: Columns
                widget: list
                fields:
                  - { name: label, label: Column label, widget: string }
                  - name: links
                    label: Links
                    widget: list
                    fields:
                      - { name: label, label: Label, widget: string }
                      - { name: href, label: Href, widget: string }

  # ── Index (homepage) ──────────────────────────────────────────────
  - name: pages
    label: "Pages"
    files:
      - name: index
        label: "Home"
        file: content/index.yml
        format: yaml
        fields:
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string, required: false }
              - { name: title, label: Title, widget: string }
              - { name: motto, label: Motto, widget: string, required: false }
          - name: studio
            label: "Section 01 · The Studio"
            widget: object
            fields:
              - { name: kicker, label: Kicker, widget: string }
              - { name: heading, label: Heading (use *italics*), widget: string }
              - { name: body, label: Body, widget: text }
              - name: links
                label: Links
                widget: list
                required: false
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: Href, widget: string }
          - name: offerings
            label: "Section 02 · What We Make"
            widget: object
            fields:
              - { name: kicker, label: Kicker, widget: string }
              - { name: heading, label: Heading, widget: string, required: false }
              - name: items
                label: Offerings
                widget: list
                fields:
                  - { name: kicker, label: Kicker, widget: string }
                  - { name: title, label: Title, widget: string }
                  - { name: blurb, label: Blurb, widget: text }
                  - { name: href, label: Href, widget: string }
                  - { name: cta, label: CTA, widget: string, default: "Learn more" }
          - name: partnership
            label: "Section 03 · In Partnership"
            widget: object
            fields:
              - { name: kicker, label: Kicker, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text, required: false }
              - name: founders
                label: Founders
                widget: list
                fields:
                  - { name: name, label: Name, widget: string }
                  - { name: company, label: Company / Role, widget: string, required: false }
                  - { name: bio, label: Bio, widget: text }
              - name: films
                label: Selected films (compact)
                widget: list
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: year, label: Year line, widget: string, required: false }
                  - { name: synopsis, label: One-line credit, widget: text, required: false }

      # ── Partnership ───────────────────────────────────────────────
      - name: partnership
        label: "Partnership"
        file: content/partnership.yml
        format: yaml
        fields:
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: headline, label: Headline (use *italics*), widget: string }
              - { name: positioning, label: Positioning, widget: string }
              - { name: meta, label: Meta strip, widget: list, field: { name: item, widget: string } }
              - { name: pills, label: Pills, widget: list, field: { name: item, widget: string } }
          - name: story
            label: "01 · Story"
            widget: object
            fields:
              - { name: kicker, widget: string }
              - { name: heading, widget: string }
              - { name: body, widget: text }
          - name: twoStudios
            label: "02 · Two Studios"
            widget: object
            fields:
              - { name: kicker, widget: string }
              - { name: heading, widget: string }
              - { name: body, widget: text, required: false }
              - name: studios
                widget: list
                fields:
                  - { name: label, label: Eyebrow, widget: string }
                  - { name: name, label: Name, widget: string }
                  - { name: founder, label: Founder line, widget: string, required: false }
                  - { name: description, label: Description, widget: text }
                  - { name: tags, label: Tags, widget: list, field: { name: tag, widget: string } }
          - name: filmmakers
            label: "03 · Filmmakers"
            widget: object
            fields:
              - { name: kicker, widget: string }
              - { name: heading, widget: string }
              - name: founders
                widget: list
                fields:
                  - { name: name, widget: string }
                  - { name: company, widget: string, required: false }
                  - { name: bio, widget: text }
                  - name: portfolioLinks
                    label: Portfolio links
                    widget: list
                    fields:
                      - { name: label, widget: string }
                      - { name: href, widget: string }
          - name: selectedWork
            label: "04 · Selected Work"
            widget: object
            fields:
              - { name: kicker, widget: string }
              - { name: heading, widget: string }
              - { name: body, widget: text, required: false }
              - name: films
                widget: list
                fields:
                  - { name: title, widget: string }
                  - { name: genre, widget: string, required: false }
                  - { name: status, widget: string, required: false }
                  - { name: logline, widget: text, required: false }
                  - { name: synopsis, widget: text, required: false }
                  - name: crew
                    label: Crew
                    widget: list
                    fields:
                      - { name: role, widget: string }
                      - { name: name, widget: string, required: false }
                      - { name: names, widget: list, required: false, field: { name: n, widget: string } }
                  - name: festivals
                    label: Festivals
                    widget: list
                    fields:
                      - { name: name, widget: string }
                      - { name: award, widget: string, required: false }
          - name: cta
            label: CTA
            widget: object
            required: false
            fields:
              - { name: eyebrow, widget: string, required: false }
              - { name: heading, widget: string }
              - { name: body, widget: text, required: false }
              - name: button
                widget: object
                fields:
                  - { name: label, widget: string }
                  - { name: href, widget: string }
              - { name: note, widget: string, required: false }

      # ── Post ──────────────────────────────────────────────────────
      - name: post
        label: "Post Production"
        file: content/post.yml
        format: yaml
        fields:
          - name: hero
            widget: object
            fields:
              - { name: headline, widget: string }
              - { name: positioning, widget: string }
              - { name: meta, widget: list, field: { name: item, widget: string } }
              - { name: pills, widget: list, field: { name: item, widget: string } }
          - name: approach
            label: "01 · Approach"
            widget: object
            fields:
              - { name: kicker, widget: string }
              - { name: heading, widget: string }
              - { name: body, widget: text }
          - name: services
            label: "02 · Services"
            widget: object
            fields:
              - { name: kicker, widget: string }
              - { name: heading, widget: string, required: false }
              - name: items
                widget: list
                fields:
                  - { name: title, widget: string }
                  - { name: description, widget: text }
                  - { name: tools, widget: list, field: { name: tool, widget: string } }
          - name: howItRuns
            label: "03 · How It Runs"
            widget: object
            fields:
              - { name: kicker, widget: string }
              - { name: heading, widget: string, required: false }
              - name: steps
                widget: list
                fields:
                  - { name: number, widget: string }
                  - { name: title, widget: string }
                  - { name: description, widget: text }
          - name: filmmakers
            label: "04 · Filmmakers"
            widget: object
            required: false
            fields:
              - { name: kicker, widget: string }
              - { name: heading, widget: string }
              - name: founders
                widget: list
                fields:
                  - { name: name, widget: string }
                  - { name: company, widget: string, required: false }
                  - { name: bio, widget: text }
                  - name: portfolioLinks
                    widget: list
                    required: false
                    fields:
                      - { name: label, widget: string }
                      - { name: href, widget: string }
          - name: cta
            widget: object
            required: false
            fields:
              - { name: heading, widget: string }
              - { name: body, widget: text, required: false }
              - name: link
                widget: object
                fields:
                  - { name: label, widget: string }
                  - { name: href, widget: string }

      # ── Grace ─────────────────────────────────────────────────────
      # Mirrors GracePageSchema in src/lib/schema.ts. Each top-level
      # object below maps to one section of /grace. Headings split into
      # `heading` (primary clause) + `headingMuted` (de-emphasized clause)
      # so the two-tone title from the design lands in two clean inputs.
      - name: grace
        label: "Grace"
        file: content/grace.yml
        format: yaml
        fields:
          - name: hero
            label: "Hero"
            widget: object
            fields:
              - { name: badge, label: "Badge pill (e.g. 'In Development · Closed Beta')", widget: string, required: false }
              - { name: title, label: "Title (primary clause)", widget: string }
              - { name: titleMuted, label: "Title (muted clause)", widget: string, required: false }
              - { name: sub, label: "Sub-headline", widget: text }
              - name: primaryCta
                label: "Primary CTA"
                widget: object
                fields:
                  - { name: label, widget: string }
                  - { name: href, widget: string }
              - name: secondaryCta
                label: "Secondary CTA"
                widget: object
                fields:
                  - { name: label, widget: string }
                  - { name: href, widget: string }
              - name: shot
                label: "Hero screenshot"
                widget: object
                fields:
                  - { name: src, label: "Image", widget: image }
                  - { name: alt, label: "Alt text", widget: string, required: false }
                  - { name: caption, label: "Caption (optional)", widget: string, required: false }

          - name: problems
            label: "01 · Problem"
            widget: object
            fields:
              - { name: num, label: "Section number", widget: string }
              - { name: numLabel, label: "Section label", widget: string, required: false }
              - { name: heading, label: "Heading (primary clause)", widget: string }
              - { name: headingMuted, label: "Heading (muted clause)", widget: string, required: false }
              - { name: body, label: "Body", widget: text, required: false }
              - name: items
                label: "Problem cards"
                widget: list
                summary: "{{fields.scenario}}"
                fields:
                  - { name: scenario, label: "Scenario (card heading)", widget: string }
                  - { name: response, label: "Response", widget: text }

          - name: thesis
            label: "02 · Thesis (Connect everything)"
            widget: object
            fields:
              - { name: num, widget: string }
              - { name: numLabel, widget: string, required: false }
              - { name: heading, label: "Heading (primary clause)", widget: string }
              - { name: headingMuted, label: "Heading (muted clause)", widget: string, required: false }
              - { name: body, widget: text, required: false }
              - { name: points, label: "Thesis points", widget: list, field: { name: point, widget: string } }
              - name: flow
                label: "Flow diagram"
                widget: object
                fields:
                  - { name: ariaLabel, label: "Screen-reader description", widget: string, required: false }
                  - { name: inputsLabel, label: "Inputs column label", widget: string, default: "Inputs" }
                  - { name: inputs, label: "Input cards", widget: list, field: { name: card, widget: string } }
                  - name: hub
                    label: "Hub (center card)"
                    widget: object
                    fields:
                      - { name: label, widget: string }
                      - { name: sub, label: "Tagline", widget: string, required: false }
                      - { name: meta, label: "Meta line", widget: string, required: false }
                  - { name: outputsLabel, label: "Outputs column label", widget: string, default: "Outputs" }
                  - { name: outputs, label: "Output cards", widget: list, field: { name: card, widget: string } }

          - name: dots
            label: "03 · Dot System"
            widget: object
            fields:
              - { name: num, widget: string }
              - { name: numLabel, widget: string, required: false }
              - { name: heading, label: "Heading (primary clause)", widget: string }
              - { name: headingMuted, label: "Heading (muted clause)", widget: string, required: false }
              - { name: body, widget: text, required: false }
              - name: items
                label: "Dot cards"
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: color, label: "Dot color", widget: select, options: ["blue", "gold", "green"] }
                  - { name: label, label: "Label (caps)", widget: string }
                  - { name: detail, widget: text }
              - { name: closer, label: "Closer line", widget: string, required: false }
              - name: shot
                label: "Section screenshot (optional)"
                widget: object
                required: false
                fields:
                  - { name: src, label: "Image", widget: image }
                  - { name: caption, widget: string, required: false }
                  - { name: alt, widget: string, required: false }
                  - { name: wide, label: "Render at full width", widget: boolean, required: false, default: true }

          - name: cascade
            label: "04 · Workflow Cascade"
            widget: object
            fields:
              - { name: num, widget: string }
              - { name: numLabel, widget: string, required: false }
              - { name: heading, label: "Heading (primary clause)", widget: string }
              - { name: headingMuted, label: "Heading (muted clause)", widget: string, required: false }
              - { name: body, widget: text, required: false }
              - name: steps
                label: "Cascade steps (rendered 4-per-row)"
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: "Step name (e.g. 'Script')", widget: string }
                  - { name: detail, widget: text }
              - name: stat
                label: "Stat callout (optional)"
                widget: object
                required: false
                fields:
                  - { name: num, label: "Number / metric", widget: string }
                  - { name: label, label: "Description", widget: string }

          - name: preProduction
            label: "05 · Pre-Production"
            widget: object
            fields:
              - { name: num, widget: string }
              - { name: numLabel, widget: string, required: false }
              - { name: heading, label: "Heading (primary clause)", widget: string }
              - { name: headingMuted, label: "Heading (muted clause)", widget: string, required: false }
              - { name: body, widget: text, required: false }
              - name: rows
                label: "Screenshot rows"
                widget: list
                summary: "{{fields.layout}} — {{fields.shots.length}} shot(s)"
                fields:
                  - { name: layout, label: "Grid layout", widget: select, options: ["one-col", "two-col", "three-col", "featured"] }
                  - name: shots
                    label: "Shots in this row"
                    widget: list
                    summary: "{{fields.caption}}"
                    fields:
                      - { name: src, label: "Image", widget: image }
                      - { name: caption, label: "Caption", widget: string, required: false }
                      - { name: alt, label: "Alt text (defaults to caption)", widget: string, required: false }
                      - { name: wide, label: "Wide", widget: boolean, required: false, default: false }

          - name: production
            label: "06 · Production"
            widget: object
            fields:
              - { name: num, widget: string }
              - { name: numLabel, widget: string, required: false }
              - { name: heading, label: "Heading (primary clause)", widget: string }
              - { name: headingMuted, label: "Heading (muted clause)", widget: string, required: false }
              - { name: body, widget: text, required: false }
              - name: rows
                label: "Screenshot rows"
                widget: list
                summary: "{{fields.layout}} — {{fields.shots.length}} shot(s)"
                fields:
                  - { name: layout, label: "Grid layout", widget: select, options: ["one-col", "two-col", "three-col", "featured"] }
                  - name: shots
                    label: "Shots"
                    widget: list
                    summary: "{{fields.caption}}"
                    fields:
                      - { name: src, label: "Image", widget: image }
                      - { name: caption, widget: string, required: false }
                      - { name: alt, widget: string, required: false }
                      - { name: wide, widget: boolean, required: false, default: false }

          - name: graceAi
            label: "07 · Grace AI"
            widget: object
            fields:
              - { name: num, widget: string }
              - { name: numLabel, widget: string, required: false }
              - { name: heading, label: "Heading (primary clause)", widget: string }
              - { name: headingMuted, label: "Heading (muted clause)", widget: string, required: false }
              - { name: body, widget: text, required: false }
              - name: shot
                label: "Section screenshot (optional)"
                widget: object
                required: false
                fields:
                  - { name: src, label: "Image", widget: image }
                  - { name: caption, widget: string, required: false }
                  - { name: alt, widget: string, required: false }
                  - { name: wide, widget: boolean, required: false, default: true }

          - name: departments
            label: "08 · Departments"
            widget: object
            fields:
              - { name: num, widget: string }
              - { name: numLabel, widget: string, required: false }
              - { name: heading, label: "Heading (primary clause)", widget: string }
              - { name: headingMuted, label: "Heading (muted clause)", widget: string, required: false }
              - { name: body, widget: text, required: false }
              - name: items
                label: "Department cards"
                widget: list
                summary: "{{fields.role}}"
                fields:
                  - { name: role, label: "Role title (e.g. '1st AD')", widget: string }
                  - { name: gives, label: "Bullet list", widget: list, field: { name: bullet, widget: string } }

          - name: compliance
            label: "09 · Compliance"
            widget: object
            fields:
              - { name: num, widget: string }
              - { name: numLabel, widget: string, required: false }
              - { name: heading, label: "Heading (primary clause)", widget: string }
              - { name: headingMuted, label: "Heading (muted clause)", widget: string, required: false }
              - { name: body, widget: text, required: false }
              - name: unions
                label: "Union tags"
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, widget: string }
                  - { name: active, label: "Highlighted", widget: boolean, default: false }
              - { name: bullets, label: "Compliance checklist", widget: list, field: { name: bullet, widget: string } }
              - { name: deferralNote, label: "Footnote / deferral note", widget: text, required: false }

          - name: vault
            label: "10 · The Vault"
            widget: object
            fields:
              - { name: num, widget: string }
              - { name: numLabel, widget: string, required: false }
              - { name: heading, label: "Heading (primary clause)", widget: string }
              - { name: headingMuted, label: "Heading (muted clause)", widget: string, required: false }
              - { name: body, widget: text, required: false }
              - name: features
                label: "Feature cards"
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, widget: string }
                  - { name: body, widget: text }
              - name: shots
                label: "Screenshots (rendered 3-col)"
                widget: list
                summary: "{{fields.caption}}"
                fields:
                  - { name: src, label: "Image", widget: image }
                  - { name: caption, widget: string, required: false }
                  - { name: alt, widget: string, required: false }
              - { name: tierNote, label: "Tier note (e.g. 'Studio-tier feature')", widget: string, required: false }

          - name: operations
            label: "11 · Operations"
            widget: object
            fields:
              - { name: num, widget: string }
              - { name: numLabel, widget: string, required: false }
              - { name: heading, label: "Heading (primary clause)", widget: string }
              - { name: headingMuted, label: "Heading (muted clause)", widget: string, required: false }
              - { name: body, widget: text, required: false }
              - name: items
                label: "Ops cards"
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, widget: string }
                  - { name: body, widget: text }
              - name: rows
                label: "Screenshot rows"
                widget: list
                summary: "{{fields.layout}} — {{fields.shots.length}} shot(s)"
                fields:
                  - { name: layout, label: "Grid layout", widget: select, options: ["one-col", "two-col", "three-col", "featured"] }
                  - name: shots
                    label: "Shots"
                    widget: list
                    summary: "{{fields.caption}}"
                    fields:
                      - { name: src, label: "Image", widget: image }
                      - { name: caption, widget: string, required: false }
                      - { name: alt, widget: string, required: false }
                      - { name: wide, widget: boolean, required: false, default: false }

          - name: whyBuilt
            label: "12 · Why we built this"
            widget: object
            fields:
              - { name: num, widget: string }
              - { name: numLabel, widget: string, required: false }
              - { name: heading, label: "Heading (primary clause)", widget: string }
              - { name: headingMuted, label: "Heading (muted clause)", widget: string, required: false }
              - { name: body, widget: text, required: false }
              - { name: paragraphs, label: "Body paragraphs", widget: list, field: { name: paragraph, widget: text } }
              - name: link
                label: "Trailing link"
                widget: object
                required: false
                fields:
                  - { name: label, widget: string }
                  - { name: href, widget: string }
              - name: shot
                label: "Side screenshot"
                widget: object
                required: false
                fields:
                  - { name: src, label: "Image", widget: image }
                  - { name: alt, widget: string, required: false }
                  - { name: caption, widget: string, required: false }

          - name: pricing
            label: "13 · Pricing"
            widget: object
            fields:
              - { name: num, widget: string }
              - { name: numLabel, widget: string, required: false }
              - { name: heading, label: "Heading (primary clause)", widget: string }
              - { name: headingMuted, label: "Heading (muted clause)", widget: string, required: false }
              - { name: body, widget: text, required: false }
              - name: tiers
                label: "Pricing tiers"
                widget: list
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { name: name, widget: string }
                  - { name: desc, label: "Short tagline", widget: string }
                  - { name: price, label: "Price (e.g. '$149')", widget: string }
                  - { name: annual, label: "Annual line (e.g. '$1,499 / year')", widget: string, required: false }
                  - { name: featured, label: "Featured tier (gold border)", widget: boolean, default: false }
                  - { name: badge, label: "Badge text (e.g. 'Recommended')", widget: string, required: false }
                  - { name: bullets, label: "Bullet list", widget: list, field: { name: bullet, widget: string } }
              - name: tierCta
                label: "Per-tier CTA button"
                widget: object
                fields:
                  - { name: label, widget: string }
                  - { name: href, widget: string }
              - { name: note, label: "Footnote", widget: text, required: false }

          - name: faq
            label: "14 · FAQ"
            widget: object
            fields:
              - { name: num, widget: string }
              - { name: numLabel, widget: string, required: false }
              - { name: heading, label: "Heading (primary clause)", widget: string }
              - { name: headingMuted, label: "Heading (muted clause)", widget: string, required: false }
              - { name: body, widget: text, required: false }
              - name: items
                label: "Q&A pairs"
                widget: list
                summary: "{{fields.q}}"
                fields:
                  - { name: q, label: "Question", widget: string }
                  - { name: a, label: "Answer", widget: text }

          - name: finalCta
