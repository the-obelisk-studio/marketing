hero:
  eyebrow: Legal
  title: DMCA Notice & Takedown
  lastUpdated: May 17, 2026
  intro: |
    Obelisk Studio respects the intellectual property rights of others and expects users of Grace Production OS to do the same. We respond to notices of alleged copyright infringement that comply with the U.S. Digital Millennium Copyright Act ("DMCA"), 17 U.S.C. §512.

    This page describes how to send a takedown notice, how to file a counter-notification, and how to reach our designated agent.

sections:
  - heading: Our designated agent
    body: |
      Obelisk Studio has registered a designated agent with the United States Copyright Office under 17 U.S.C. §512(c)(2). Notices that meet the requirements below should be addressed to the agent at the contact information listed at the bottom of this page.

      Notices that do not meet the statutory requirements may not entitle us to act on them and may not start the response clock under §512. Please follow the format below carefully, or send your notice through your own counsel.

  - heading: How to file a takedown notice
    body: |
      To be effective under 17 U.S.C. §512(c)(3), a notice must include all of the following. Sending a misleading notice is a federal offense under §512(f).
    list:
      - label: Signature
        detail: A physical or electronic signature of the copyright owner or a person authorized to act on the owner's behalf.
      - label: Identification of the work
        detail: A description of the copyrighted work claimed to have been infringed (e.g., title, author, registration number if available).
      - label: Identification of the infringing material
        detail: A description of the material that is claimed to be infringing or the subject of infringing activity, with enough detail for us to locate it (URLs, screener share tokens, file names, account or production identifiers).
      - label: Contact information
        detail: Your name, address, telephone number, and email address.
      - label: Good-faith statement
        detail: A statement that you have a good-faith belief that the use of the material in the manner complained of is not authorized by the copyright owner, its agent, or the law.
      - label: Accuracy statement
        detail: A statement, made under penalty of perjury, that the information in the notice is accurate and that you are the copyright owner or are authorized to act on the owner's behalf.

  - heading: What we do when we receive a valid notice
    body: |
      When we receive a notice that substantially complies with §512(c)(3), we will (a) remove or disable access to the identified material, (b) take reasonable steps to notify the affected user, and (c) preserve a log of the notice and our response. We may forward the notice to the affected user in unredacted form unless you ask us in writing not to share specific items.

  - heading: How to file a counter-notification
    body: |
      If your content was removed in response to a notice and you believe the removal was a mistake or the result of misidentification, you may file a counter-notification under 17 U.S.C. §512(g). A counter-notification must include all of the following.
    list:
      - label: Signature
        detail: Your physical or electronic signature.
      - label: Identification of the material
        detail: Identification of the material that was removed or disabled, and the location at which the material appeared before it was removed or disabled.
      - label: Good-faith statement
        detail: A statement, under penalty of perjury, that you have a good-faith belief that the material was removed or disabled as a result of mistake or misidentification.
      - label: Contact and consent to jurisdiction
        detail: Your name, address, and telephone number, and a statement that you consent to the jurisdiction of the United States District Court for the district where your address is located (or, if your address is outside the United States, for any judicial district in which Obelisk Studio may be found), and that you will accept service of process from the person who provided the original notice or an authorized agent.

  - heading: What happens after a counter-notification
    body: |
      We will forward your counter-notification to the original notifier. If they do not file an action seeking a court order against your activity within ten business days, we may restore the material.

  - heading: Repeat infringers
    body: |
      In appropriate circumstances, and at our sole discretion, we will terminate the accounts of users who repeatedly receive notices we determine, in good faith, to be valid. We do not maintain a public counter of strikes against any individual account.

  - heading: Misuse of this process
    body: |
      Knowingly sending a false or misleading notice under §512(c) is a violation of federal law that may subject the sender to damages (including the costs and attorneys' fees of the affected user) under 17 U.S.C. §512(f). If you are not certain whether material is infringing, or whether you are authorized to file a notice, consult an attorney before sending.

contact:
  heading: Designated agent
  body: |
    Send DMCA notices to the designated agent for Obelisk Studio LLC at the email below. Postal correspondence is also accepted; reply to the email and we will provide the current registered mailing address. The agent's identity and contact information are also on file with the U.S. Copyright Office Designated Agent Directory.
  email: dmca@theobeliskstudio.com
