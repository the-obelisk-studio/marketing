graceAi:
  num: "07"
  numLabel: Grace AI
  heading: A co-pilot
  headingMuted: that knows your production.
  body: >
    The chat panel reads the production state and answers questions in context.
    Why is this scene's HMU so long? Which crew member's call time conflicts
    with a turnaround? What's our French-hours exposure today? Trained on
    industry compliance — IATSE, DGA, SAG, Teamsters thresholds built in.
  shot:
    src: /uploads/grace/grace-ai-panel.png
    caption: Grace AI — co-pilot panel open on the strip board
    wide: true
departments:
  num: "08"
  numLabel: Built for the people on set
  heading: Every department,
  headingMuted: the same picture.
  body: >
    Grace's access model maps to how productions are actually organized. The
    right people see the right view, and nothing else.
  items:
    - role: 1st AD
      gives:
        - Call sheets that build themselves from the schedule
        - Compliance alerts before the sheet locks, not after payroll
        - Set Dashboard that mirrors the strip plan in real time
    - role: UPM / Line Producer
      gives:
        - Live budget actuals from POs and vendor rolls
        - What-if branches for schedule changes, costed out before commit
        - Owner-grade access to every dept's daily output
    - role: Director
      gives:
        - Shot list, storyboards, scene timing, creative refs
        - Take selects flowing straight to the editor's log
        - A Grace AI panel that knows your production's state
    - role: DP
      gives:
        - Shot list with movement, lens, camera notes per scene
        - VFX flagging + per-shot capture requirements
        - Camera report + scene timing exports for the camera dept
    - role: Script Supervisor
      gives:
        - Per-take logging with circle/hold/NG and continuity photos
        - Cross-shot-list-version editor log — never orphans a circled take
        - Daily Script Sup Report PDF, ready to send
    - role: VFX Supervisor
      gives:
        - Flag shots from the shot list; track plates required vs captured
        - AI auto-suggests VFX shots from scene context
        - Per-shot turnover package for vendors
    - role: DIT
      gives:
        - "Media-card pipeline: hot → offloading → offloaded → verified →
          cleared"
        - Per-day dailies packages delivered to editorial via the Vault
        - Shared-key delivery — no byte duplication
compliance:
  num: "09"
  numLabel: Built-in compliance
  heading: Union rules,
  headingMuted: enforced when it matters.
  body: >
    Pick your union profile on production setup. Grace's compliance engine uses
    the right thresholds for turnaround, meal penalties, OT, and minor hours
    from day one.
  unions:
    - label: IATSE
      active: true
    - label: DGA
      active: false
    - label: SAG-AFTRA
      active: false
    - label: Teamsters
      active: false
    - label: Non-union
      active: false
    - label: Mixed (strictest)
      active: false
  bullets:
    - Turnaround check at call-sheet lock — refuses approval on a short rest,
      requires authorized override
    - Meal-penalty math baked into the day clock — six- and twelve-hour windows
      tracked
    - Minor hours hard-blocked server-side — minors can't be scheduled past the
      cap without acknowledgement
    - French hours (continuous workday) handled as a per-day flag
    - Exhibit G, Studio Teacher Daily Report, Safety Meeting sign-in, Daily
      Timesheets — generated as PDFs
  deferralNote: "Paper-first today: generated PDFs get signed in person and
    re-uploaded. In-app electronic signatures coming soon."
vault:
  num: "10"
  numLabel: The Vault
  heading: Send screeners.
  headingMuted: Stay in control.
  body: >
    Send a cut to a financier on Tuesday. Know on Friday they opened it twice
    from a hotel Wi-Fi in Park City.
  features:
    - title: Magic-link delivery
      body: Recipient verifies via 6-digit code to their email. No accounts to create.
    - title: Forensic watermarking
      body: Recipient email, share ID, UTC timestamp burned into the player.
    - title: Device locking
      body: First device claims the session. Second device gets kicked.
    - title: Time-bound access
      body: Sliding session refresh, range-only streaming, access codes that expire.
    - title: Full event log
      body: Code requests, play starts, seeks, device changes. Everything tracked.
    - title: DIT pipeline
      body: Dailies packages delivered with the same auth and forensic trail.
  shots:
    - src: /uploads/grace/dit-pipeline.png
      caption: DIT pipeline
    - src: /uploads/grace/dailies.png
      caption: Dailies delivery
    - src: /uploads/grace/screeners.png
      caption: Screeners — watermarked
  tierNote: The Vault is a Studio-tier feature.
