hero:
  badge: In Development · Closed Beta
  title: The production operating system
  titleMuted: built by working filmmakers.
  sub: Script, schedule, budget, and call sheets from one source of truth — so a 4
    pm script revision doesn't become a 7 pm crisis.
  primaryCta:
    label: Request beta access →
    href: /beta-interest
  secondaryCta:
    label: See how it works ↓
    href: "#problem"
  shot:
    src: /uploads/grace/per-production-dashboard.png
    alt: Per-production dashboard
problems:
  num: "01"
  heading: Three problems every production has,
  headingMuted: None of them have to.
  items:
    - scenario: Same scene numbers, re-typed in four tools by Tuesday.
      response: Break it down once. Schedule, budget, DOOD and call sheet read from
        the same scenes — every element, every cast member, every location,
        already there. The call sheet builds itself from the day.
    - scenario: Five days got added to the schedule. The budget hasn't heard.
      response: One stripboard, one budget, one DOOD. Every department reads the same
        number. one change cascades downstream.
    - scenario: Dailies sit on a card overnight. The script supervisor's circles never
        make it to the editor's bin.
      response: Cards offload through the DIT pipeline. Dailies hit editorial the same
        night, with circled takes from script sup and any VFX flags already
        tagged. When it's time for turnover, the EDL writes itself.
thesis:
  num: "02"
  heading: Connect everything.
  headingMuted: Re-enter nothing.
  body: >
    Grace is built around one idea: every department on a film should be working
    from the same picture. Breakdown feeds schedule. Schedule feeds budget.
    Budget feeds call sheet. Everything connects, nothing gets re-entered, and
    no one is working from a stale version. One system, end to end — from page
    to wrap.
  points:
    - One upload changes everything downstream.
    - One screen for the day on set — everything the floor needs, live.
    - Every role sees their own view — and nothing else.
    - Compliance flagged when the day's being built, not after payroll.
  flow:
    ariaLabel: Inputs flow into Grace's single source of truth, which cascades into
      outputs.
    inputsLabel: Inputs
    inputs:
      - Script & revisions
      - Cast & crew rosters
      - Union & compliance rules
      - Dailies & Screeners
    hub:
      label: Grace
      sub: One source of truth
      meta: Breakdown · Schedule · Budget
    outputsLabel: Outputs
    outputs:
      - The whole pre-pro, ready to send
      - Live budget actuals
      - Editor turnover & secure delivery
dots:
  num: "03"
  heading: Co-pilot,
  headingMuted: not autopilot.
  body: >
    Every value in Grace carries a colored dot that tells you who made the call.
    Software does the busywork. The people running the show stay in control.
  items:
    - color: blue
      label: Grace did this
      detail: Suggested from your data — rate cards, breakdown inferences, recommended
        pacings. Editable, overridable.
    - color: gold
      label: You did this
      detail: Entered or changed by a human. Grace doesn't touch a gold value without
        asking.
    - color: green
      label: Verified
      detail: Grace Suggested, verified.
  closer: Grace suggests. You decide.
  shot:
    src: /uploads/grace/dot-system.png
    caption: Breakdown — dots visible in every cell
    wide: true
cascade:
  num: "04"
  numLabel: One workflow, end to end
  heading: Upload the script.
  headingMuted: Everything else cascades.
  body: >
    Every module in Grace reads from the modules upstream of it. Re-enter
    nothing, hand off nothing.
  steps:
    - label: Script
      detail: PDF, FDX, Fountain, DOCX. Parsed into scenes, headings, elements.
    - label: Breakdown
      detail: Per-scene elements, cast, locations. Diff-aware revisions.
    - label: Schedule
      detail: Stripboard, DOOD, location packing, HMU chain.
    - label: Budget
      detail: Line items, vendor POs, actualized rollup.
    - label: Call Sheet
      detail: Auto-built from the day. Weather, Hospital, French hours.
    - label: Set Dashboard
      detail: Live timing, takes, circle/hold, upcoming, projected times. Your day,
        live.
    - label: Timecards
      detail: Prefilled from call time + meal duration. Overrides flagged.
    - label: Editor Log
      detail: CSV, PDF, EDL, FCPXML for turnover.
  stat:
    num: ~12 min
    label: From script upload to first call sheet on a 90-page feature.
