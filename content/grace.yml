faq:
  num: "14"
  heading: Things people ask
  headingMuted: before they buy.
  items:
    - q: What makes Grace different from existing production software?
      a: Most production tools are databases — a script in one place, a schedule in
        another, a call sheet that someone re-types from both. Grace is a
        intelligent workflow. The script change cascades to the call sheet on
        its own; every department reads the same number, and union compliance is
        checked when the day is built, not at payroll audit. Every value carries
        a dot showing who decided it — Grace suggested, you decided, or signed.
        Humans run the production. Software handles the busywork.
    - q: Can my whole crew use it, or just production?
      a: The whole crew. Seats are organized by role — producers and UPMs at the top,
        directors and department heads in the middle, crew and cast at the
        floor. Standard includes 28 seats out of the box; Studio includes 56.
        Seat packs extend further as you need them. The crew tier sees only
        their day, their call, their own time card — never the budget, never the
        script unless they're in the scene.
    - q: What happens to my data if I cancel?
      a: Your access stays unaffected until the end of billing period then it switches
        you to read-only. every script, breakdown, schedule, budget, and call
        sheet is still there, you just can't edit. Resume the subscription any
        time and editing comes back.
    - q: Does it handle weekly TV or multi-block episodics?
      a: Today Grace is optimized for one production at a time. Weekly TV and
        multi-block episodic shows are on the roadmap. If that's your shape,
        write to us — we'd rather hear from you before we build it than after.
    - q: What about SAG Ultra Low Budget / Short Project Agreement?
      a: Standard SAG-AFTRA thresholds work today. The tier-specific variants — Low
        Budget, Ultra Low Budget, Short Project Agreement — are in the next
        compliance release. If you're shooting on one of those agreements now,
        we'll get them in front of our timeline.
    - q: How does Grace handle confidential screeners?
      a: Through the Vault — magic-link delivery with a 6-digit code to the
        recipient's email, forensic watermarking burned into every frame (email
        + session ID), device locking on first claim, and a full event log of
        code requests, plays, seeks, and device changes. The recipient gets the
        cut without an account.
    - q: Are you self-hosted or SaaS?
      a: SaaS, with US-based hosting and storage. Self-hosted deployment for studios
        that need it is on the table — write to us if it's a hard requirement.
    - q: Who's behind it?
      a: Grace Production OS is a joint venture between Obelisk Studios, founded by
        Kshitij Kapil, and TDH Systems, founded by Siddharth Agrawal. Two
        filmmakers — a working DP and colorist on one side, a producer and
        engineer on the other — building the tool they wanted on their own
        pictures. The full story is on the partnership page.
