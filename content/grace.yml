# Grace product page content. Edited via Decap CMS at /admin/.
# Schema: src/lib/schema.ts → GracePageSchema.
#
# The page is a long-form walkthrough. Every top-level key here maps to
# one section of /grace, in render order. Each section provides its own
# section number ("01", "02"…) so adding/removing a section won't shift
# the labels visually unless you re-number.
#
# Heading style: most section titles split into two clauses — the main
# clause and a de-emphasized clause. They render together as one <h2>
# with the muted half in a lighter ink. Edit each separately below.
#
# Image grids: under preProduction, production, operations, each `row`
# has a `layout` (one-col / two-col / three-col / featured) that picks
# the grid layout. Add or reorder shots within a row to change which
# screenshots appear side-by-side. Images live under /public/uploads/grace/.

hero:
  badge: "In Development · Closed Beta"
  title: "The production operating system"
  titleMuted: "built by working filmmakers."
  sub: "Script, schedule, budget, call sheets, and on-set comms running from one source of truth — so a 4 pm script revision doesn't become a 7 pm crisis."
  primaryCta: { label: "Request beta access →", href: "/contact?topic=Grace" }
  secondaryCta: { label: "See how it works ↓", href: "#problem" }
  shot:
    src: /uploads/grace/per-production-dashboard.png
    alt: "Per-production dashboard"

problems:
  num: "01"
  heading: "Three things that go wrong every week,"
  headingMuted: "handled."
  items:
    - scenario: "Tomorrow's call sheet is hostage to today's script revision."
      response: "Upload the new revision. Grace diffs it against the current breakdown, lets you accept or reject scene-by-scene, and rolls the survivors into a forked schedule, budget, and shot list. The call sheet rebuilds itself."
    - scenario: "Three departments are looking at three versions of the schedule."
      response: "One stripboard, one budget, one DOOD. Every department reads the same number. Approvals lock the version; what-if branches let you model a re-shoot day without breaking what's live."
    - scenario: "Compliance violations show up in payroll, not on set."
      response: "Turnaround, meal-penalty, and minor-hours thresholds are checked when you build the day — not when you account for it. The sheet refuses to lock on a violation unless an authorized signer overrides it. Audit trail attached."

thesis:
  num: "02"
  heading: "Connect everything."
  headingMuted: "Re-enter nothing."
  body: |
    Grace is built around one idea: every department on a film should be working from the same picture. Breakdown feeds schedule. Schedule feeds budget. Budget feeds call sheet. Everything connects, nothing gets re-entered, and no one is working from a stale version.
  points:
    - "One upload changes everything downstream."
    - "The set dashboard is the schedule, live."
    - "Cast and crew see only what they should."
    - "What-if branches without breaking what's live."
  flow:
    ariaLabel: "Inputs flow into Grace's single source of truth, which cascades into outputs."
    inputsLabel: "Inputs"
    inputs:
      - "Script & revisions"
      - "Cast & crew rosters"
      - "Union & compliance rules"
    hub:
      label: "Grace"
      sub: "One source of truth"
      meta: "Breakdown · Schedule · Budget"
    outputsLabel: "Outputs"
    outputs:
      - "Call sheets, auto-built"
      - "Time cards, prefilled"
      - "Editor turnover & exports"

dots:
  num: "03"
  heading: "Co-pilot,"
  headingMuted: "not autopilot."
  body: |
    Every value in Grace carries a colored dot that tells you who made the call. Software does the busywork. The people running the show stay in the chair.
  items:
    - color: blue
      label: "Grace did this"
      detail: "Suggested from your data — rate cards, breakdown inferences, recommended pacings. Editable, overridable."
    - color: gold
      label: "You did this"
      detail: "Entered or changed by a human. Grace doesn't touch a gold value without asking."
    - color: green
      label: "Verified"
      detail: "Locked from a signed document — deal memo, contract, executed compliance form."
  closer: "Grace suggests. You decide. Signed docs lock it in."
  shot:
    src: /uploads/grace/dot-system.png
    caption: "Breakdown — dots visible in every cell"
    wide: true

cascade:
  num: "04"
  numLabel: "One workflow, end to end"
  heading: "Upload the script."
  headingMuted: "Everything else cascades."
  body: |
    Every module in Grace reads from the modules upstream of it. Re-enter nothing, hand off nothing.
  steps:
    - { label: "Script",        detail: "PDF, FDX, Fountain, DOCX. Parsed into scenes, headings, elements." }
    - { label: "Breakdown",     detail: "Per-scene elements, cast, locations. Diff-aware revisions." }
    - { label: "Schedule",      detail: "Stripboard, DOOD, location packing, HMU chain." }
    - { label: "Budget",        detail: "Line items, vendor POs, actualized rollup." }
    - { label: "Call Sheet",    detail: "Auto-built from the day. Weather, drive time, French hours." }
    - { label: "Set Dashboard", detail: "Live timing, takes, circle/hold. The schedule, live." }
    - { label: "Timecards",     detail: "Prefilled from call time + meal duration. Overrides flagged." }
    - { label: "Editor Log",    detail: "CSV, PDF, EDL, FCPXML for turnover." }
  stat:
    num: "~12 min"
    label: "From script upload to first sendable call sheet on a 90-page feature."

preProduction:
  num: "05"
  numLabel: "Pre-Production"
  heading: "Plan the picture"
  headingMuted: "before the picture rolls."
  body: |
    Script breakdown that knows scenes and elements. Scheduling and DOOD that pack locations and respect minor hours. A budget that actualizes from purchase orders. A shot list with VFX flags and storyboards. All connected, all live.
  rows:
    - layout: two-col
      shots:
        - { src: /uploads/grace/scenes-list.png,      caption: "Scene breakdown" }
        - { src: /uploads/grace/element-summary.png,  caption: "Element summary" }
    - layout: three-col
      shots:
        - { src: /uploads/grace/schedule.png,  caption: "Strip board" }
        - { src: /uploads/grace/dood.png,      caption: "Day Out of Days" }
        - { src: /uploads/grace/locations.png, caption: "Locations" }
    - layout: two-col
      shots:
        - { src: /uploads/grace/budget.png,        caption: "Budget — top sheet" }
        - { src: /uploads/grace/budget-detail.png, caption: "Budget — line-item detail" }
    - layout: two-col
      shots:
        - { src: /uploads/grace/shot-list.png,    caption: "Shot list" }
        - { src: /uploads/grace/creative-refs.png, caption: "Creative references" }

production:
  num: "06"
  numLabel: "Production"
  heading: "Every department,"
  headingMuted: "working from the same picture."
  body: |
    Call sheets that build themselves from the schedule. Time cards that prefill from call time and meal duration. A set dashboard tracking actuals against the strip plan. Script supervisor notes, editor log, VFX flags — every department's daily work in one tool.
  rows:
    - layout: featured
      shots:
        - { src: /uploads/grace/day1-approved.png, caption: "Call sheet — approved" }
        - { src: /uploads/grace/set-dashboard.png, caption: "Set dashboard — live" }
    - layout: three-col
      shots:
        - { src: /uploads/grace/set-dashboard-mobile-modes.png, caption: "Mobile dashboards" }
        - { src: /uploads/grace/timecards-day1.png,             caption: "Timecards" }
        - { src: /uploads/grace/script-supervisor.png,          caption: "Script supervisor" }
    - layout: two-col
      shots:
        - { src: /uploads/grace/editor-log.png, caption: "Editor log" }
        - { src: /uploads/grace/vfx.png,        caption: "VFX tracking" }

graceAi:
  num: "07"
  numLabel: "Grace AI"
  heading: "A co-pilot"
  headingMuted: "that knows your production."
  body: |
    The chat panel reads the production state and answers questions in context. Why is this scene's HMU so long? Which crew member's call time conflicts with a turnaround? What's our French-hours exposure today? Trained on industry compliance — IATSE, DGA, SAG, Teamsters thresholds built in.
  shot:
    src: /uploads/grace/grace-ai-panel.png
    caption: "Grace AI — co-pilot panel open on the strip board"
    wide: true

departments:
  num: "08"
  numLabel: "Built for the people on set"
  heading: "Every department,"
  headingMuted: "the same picture."
  body: |
    Grace's access model maps to how productions are actually organized. The right people see the right view, and nothing else.
  items:
    - role: "1st AD"
      gives:
        - "Call sheets that build themselves from the schedule"
        - "Compliance alerts before the sheet locks, not after payroll"
        - "Set Dashboard that mirrors the strip plan in real time"
    - role: "UPM / Line Producer"
      gives:
        - "Live budget actuals from POs and vendor rolls"
        - "What-if branches for schedule changes, costed out before commit"
        - "Owner-grade access to every dept's daily output"
    - role: "Director"
      gives:
        - "Shot list, storyboards, scene timing, creative refs"
        - "Take selects flowing straight to the editor's log"
        - "A Grace AI panel that knows your production's state"
    - role: "DP"
      gives:
        - "Shot list with movement, lens, camera notes per scene"
        - "VFX flagging + per-shot capture requirements"
        - "Camera report + scene timing exports for the camera dept"
    - role: "Script Supervisor"
      gives:
        - "Per-take logging with circle/hold/NG and continuity photos"
        - "Cross-shot-list-version editor log — never orphans a circled take"
        - "Daily Script Sup Report PDF, ready to send"
    - role: "VFX Supervisor"
      gives:
        - "Flag shots from the shot list; track plates required vs captured"
        - "AI auto-suggests VFX shots from scene context"
        - "Per-shot turnover package for vendors"
    - role: "DIT"
      gives:
        - "Media-card pipeline: hot → offloading → offloaded → verified → cleared"
        - "Per-day dailies packages delivered to editorial via the Vault"
        - "Shared-key delivery — no byte duplication"

compliance:
  num: "09"
  numLabel: "Built-in compliance"
  heading: "Union rules,"
  headingMuted: "enforced when it matters."
  body: |
    Pick your union profile on production setup. Grace's compliance engine uses the right thresholds for turnaround, meal penalties, OT, and minor hours from day one.
  unions:
    - { label: "IATSE",            active: true  }
    - { label: "DGA",              active: false }
    - { label: "SAG-AFTRA",        active: false }
    - { label: "Teamsters",        active: false }
    - { label: "Non-union",        active: false }
    - { label: "Mixed (strictest)", active: false }
  bullets:
    - "Turnaround check at call-sheet lock — refuses approval on a short rest, requires authorized override"
    - "Meal-penalty math baked into the day clock — six- and twelve-hour windows tracked"
    - "Minor hours hard-blocked server-side — minors can't be scheduled past the cap without acknowledgement"
    - "French hours (continuous workday) handled as a per-day flag"
    - "Exhibit G, Studio Teacher Daily Report, Safety Meeting sign-in, Daily Timesheets — generated as PDFs"
  deferralNote: "Paper-first today: generated PDFs get signed in person and re-uploaded. In-app electronic signatures (DocuSeal-backed) land in the next release."

vault:
  num: "10"
  numLabel: "The Vault"
  heading: "Send screeners."
  headingMuted: "Stay in control."
  body: |
    Send a cut to a financier on Tuesday. Know on Friday they opened it twice from a hotel Wi-Fi in Park City.
  features:
    - { title: "Magic-link delivery",      body: "Recipient verifies via 6-digit code to their email. No accounts to create." }
    - { title: "Forensic watermarking",    body: "Recipient email, share ID, UTC timestamp burned into the player." }
    - { title: "Device locking",           body: "First device claims the session. Second device gets kicked." }
    - { title: "Time-bound access",        body: "Sliding session refresh, range-only streaming, access codes that expire." }
    - { title: "Full event log",           body: "Code requests, play starts, seeks, device changes. Everything tracked." }
    - { title: "DIT pipeline",             body: "Dailies packages delivered with the same auth and forensic trail." }
  shots:
    - { src: /uploads/grace/dit-pipeline.png, caption: "DIT pipeline" }
    - { src: /uploads/grace/dailies.png,      caption: "Dailies delivery" }
    - { src: /uploads/grace/screeners.png,    caption: "Screeners — watermarked" }
  tierNote: "The Vault is a Studio-tier feature."

