faq:
  num: "14"
  heading: "Things people ask"
  headingMuted: "before they buy."
  items:
    - q: "How is this different from StudioBinder / Yamdu / Croogloo?"
      a: "Those tools are databases. Grace is a workflow. Your script change cascades to your call sheet automatically; their schedule pages don't talk to their call sheet pages. We also enforce union compliance at the point of decision, not at the audit. And every value carries a dot showing who decided it — humans, not the software, own the production."
    - q: "Can my whole crew use it, or just production?"
      a: "Whole crew. Seat tiers are T1 (producer / UPM), T2 (director / 1st AD / DP / department heads), T3 (crew + cast). Standard includes 28 seats out of the box; Studio includes 56. Pack add-ons extend further. T3 sees only their day, their call, their own time card — never the budget."
    - q: "What happens to my data if I cancel?"
      a: "Read-only access through the end of the billing period. Export every artifact (PDFs, CSVs, EDL, FCPXML) before then. After that, we retain your data for 30 days in case you reactivate, then deletion runs on schedule per the Privacy Policy."
    - q: "Does it handle weekly TV or multi-block episodics?"
      a: "Today, Grace is optimized for a single production at a time. Multi-block / weekly TV is on the roadmap. If that's your shape, reach out — we'd like to talk before we build it."
    - q: "What about SAG Ultra Low Budget / Short Project Agreement?"
      a: "Standard SAG-AFTRA thresholds today. SAG tier-specific variants (Low Budget, Ultra Low Budget, Short Project Agreement) are scoped for the next compliance release."
    - q: "Can I run this on a script I haven't shared with anyone yet?"
      a: "Yes. Scripts live in your private org. Per-section access controls mean a confidential script can be uploaded by the producer and stay locked from the rest of the org until it's broken down and shared. The Vault adds another layer: magic-link sharing with watermarking and device locking when you do need to send something out."
    - q: "Are you self-hosted or SaaS?"
      a: "SaaS, hosted on Railway + Neon (US-East) with Cloudflare R2 for object storage. Self-hosted for enterprise is on the table — get in touch if that's a hard requirement."
    - q: "Who's behind it?"
      a: "Obelisk Studios — Kshitij Kapil (working DP / colorist) and Siddharth Agrawal. A real, small, working studio. Burbank, California."

