# /product page — the conversion-focused product pitch.
# Distinct from /grace (basic overview) and /grace/guide (post-purchase docs).
# Edited via Decap CMS. Schema: src/lib/schema.ts → ProductPageSchema.

hero:
  eyebrow: "Grace · Production OS"
  title: "The production operating system, built by working filmmakers."
  sub: "Script, schedule, budget, call sheets, and on-set comms running from one source of truth — so a 4 pm script revision doesn't become a 7 pm crisis."
  primaryCta: { label: "Request beta access", href: "/contact?topic=Grace" }
  secondaryCta: { label: "See how it works", href: "#workflow" }

painCards:
  kicker: "01 · The pain it kills"
  heading: "Three things that go wrong every week, *handled.*"
  cards:
    - scenario: "Tomorrow's call sheet is hostage to today's script revision."
      response: "Upload the new revision. Grace diffs it against the current breakdown, lets you accept or reject scene-by-scene, and rolls the survivors into a forked schedule + budget + shot list. The call sheet rebuilds itself."
    - scenario: "Three departments are looking at three versions of the schedule."
      response: "One stripboard, one budget, one DOOD. Every department reads the same number. Approvals lock the version; what-if branches let you model a re-shoot day without breaking what's live."
    - scenario: "Compliance violations show up in payroll, not on set."
      response: "Turnaround, meal-penalty, and minor-hours thresholds are checked when you build the day — not when you account for it. The sheet refuses to lock on a violation unless an authorized signer overrides it. Audit trail attached."

dotSystem:
  kicker: "02 · The Dot System"
  heading: "Co-pilot, *not autopilot.*"
  body: |
    Every value in Grace carries a colored dot that tells you who made the call. Software does the busywork. The people running the show stay in the chair.
  dots:
    - color: blue
      label: "Blue · Grace did this"
      detail: "Suggested from your data — rate cards, breakdown inferences, recommended pacings."
    - color: gold
      label: "Gold · You did this"
      detail: "Entered or changed by a human. Grace doesn't touch a gold value without asking."
    - color: green
      label: "Green · Verified"
      detail: "Locked from a signed document — deal memo, contract, executed compliance form."
  closingLine: "Grace suggests. You decide. Signed docs lock it in."

workflow:
  kicker: "03 · One workflow, end to end"
  heading: "Upload the script. *Everything else cascades.*"
  body: |
    Every module in Grace reads from the modules upstream of it. Re-enter nothing, hand off nothing.
  steps:
    - { label: "Script", detail: "PDF, FDX, Fountain, DOCX. Claude parses scenes, headings, elements." }
    - { label: "Breakdown", detail: "Per-scene elements, cast, locations. Diff-aware revisions." }
    - { label: "Schedule", detail: "Stripboard, DOOD, location packing, HMU chain." }
    - { label: "Budget", detail: "Line items, vendor POs, actualized rollup." }
    - { label: "Call Sheet", detail: "Auto-built from the day. Weather, drive time, French hours." }
    - { label: "Set Dashboard", detail: "Live timing, takes, circle/hold. The schedule, live." }
    - { label: "Timecards", detail: "Prefilled from call time + meal duration. Human overrides flagged." }
    - { label: "Editor Log", detail: "CSV, PDF, EDL, FCPXML for turnover." }
  timeToValue: "On a 90-page feature, script upload to first sendable call sheet runs about twelve minutes."

roles:
  kicker: "04 · Built for the people on set"
  heading: "Every department, *the same picture.*"
  body: |
    Grace's access model maps to how productions are actually organized. The right people see the right view, and nothing else.
  tiles:
    - role: "1st AD"
      gives:
        - "Call sheets that build themselves from the schedule"
        - "Compliance alerts before the sheet locks, not after payroll"
        - "Set Dashboard that mirrors the strip plan in real time"
    - role: "UPM / Line Producer"
      gives:
        - "Live budget actuals from POs and vendor rolls"
        - "What-if branches for schedule changes, costed out before commit"
        - "Owner-grade access to every dept's daily output"
    - role: "Director"
      gives:
        - "Shot list, storyboards, scene timing, creative refs"
        - "Take selects flowing straight to the editor's log"
        - "A Grace AI panel that knows your production's state"
    - role: "DP"
      gives:
        - "Shot list with movement, lens, camera notes per scene"
        - "VFX flagging + per-shot capture requirements"
        - "Camera report + scene timing exports for the camera dept"
    - role: "Script Supervisor"
      gives:
        - "Per-take logging with circle/hold/NG and continuity photos"
        - "Cross-shot-list-version editor log — never orphans a circled take"
        - "Daily Script Sup Report PDF, ready to send"
    - role: "VFX Supervisor"
      gives:
        - "Flag shots from the shot list; track plates required vs captured"
        - "Claude Haiku auto-suggests VFX shots from scene context"
        - "Per-shot turnover package for vendors"
    - role: "DIT"
      gives:
        - "Media-card pipeline: hot → offloading → offloaded → verified → cleared"
        - "Per-day dailies packages delivered to editorial via the Vault"
        - "Shared-key delivery — no R2 byte duplication"

compliance:
  kicker: "05 · Built-in compliance"
  heading: "Union rules, *enforced when it matters.*"
  body: |
    Pick your union profile on production setup. Grace's compliance engine uses the right thresholds for turnaround, meal penalties, OT, and minor hours from day one.
  profiles:
    - "IATSE"
    - "DGA"
    - "SAG-AFTRA"
    - "Teamsters"
    - "Non-union"
    - "Mixed (defaults to strictest)"
  features:
    - "Turnaround check at call-sheet lock — refuses approval on a short rest, requires authorized override"
    - "Meal-penalty math baked into the day clock — six- and twelve-hour windows tracked"
    - "Minor hours hard-blocked server-side — minors can't be scheduled past the cap without acknowledgement"
    - "French hours (continuous workday) handled as a per-day flag"
    - "Exhibit G, Studio Teacher Daily Report, Safety Meeting sign-in, Daily Crew/Cast Timesheets — generated as PDFs"
  deferralNote: "Paper-first today: generated PDFs get signed in person and re-uploaded. In-app electronic signatures (DocuSeal-backed) land in the next release."

vault:
  kicker: "06 · The Vault"
  heading: "Send screeners. *Stay in control.*"
  body: |
    Send a cut to a financier on Tuesday. Know on Friday they opened it twice from a hotel Wi-Fi in Park City.
  features:
    - "Magic-link delivery — recipient verifies via 6-digit code to their email"
    - "Forensic watermarking — recipient email, share ID, UTC timestamp burned into the player"
    - "Device locking — first device claims the session; second device gets kicked"
    - "Time-bound access codes, sliding session refresh, range-only streaming"
    - "Full event log: code requests, play starts, seeks, device changes"
    - "DIT pipeline included: dailies packages delivered with the same auth and forensic trail"
  tierNote: "The Vault is a Studio-tier feature."

whyBuilt:
  kicker: "07 · Why we built this"
  heading: "Every feature here exists because *one of us needed it.*"
  body: |
    Grace is built by Kshitij Kapil, a working cinematographer and colorist, and Siddharth Agrawal, who runs the studio. We've sat in the AD chair, signed the timesheets, and watched a call sheet die because someone re-cut the script at 4 pm. This isn't market research. It's the tool we wanted on our own pictures.
  link: { label: "About the partnership", href: "/partnership" }

pricing:
  kicker: "08 · Pricing"
  heading: "Two plans. *No per-user gouging.*"
  body: |
    Pricing is per production company, not per seat. Pack-style add-ons let you grow without re-negotiating.
  tiers:
    - name: "Standard"
      tagline: "Run pre-pro and shoot a project end-to-end."
      price: "$149 / month  ·  $1,499 / year"
      bullets:
        - "1 active production"
        - "3 producer-tier · 5 dept-head-tier · 20 crew/cast seats"
        - "Full breakdown, schedule, budget, call sheets, set dashboard, compliance, editor turnover"
        - "Vault and DIT pipeline available as upgrade"
    - name: "Studio"
      tagline: "Plus secure dailies, screener portal, and DIT workflow."
      price: "$299 / month  ·  $2,999 / year"
      bullets:
        - "Everything in Standard"
        - "Vault: forensic-watermarked screener portal with magic-link auth"
        - "DIT pipeline: media cards, dailies packages, clip delivery to editorial"
        - "Higher seat ceilings: 6 T1 · 10 T2 · 40 T3"
        - "Priority beta support"
  addonNote: "Add-on packs: additional production slots ($30/mo), seat packs by tier. All prorated."
  betaNote: "We're in closed beta. Beta access includes a 90-day trial on a card-on-file Standard or Studio subscription. Tell us about your production and we'll get you set up."
  fullPricingLink: { label: "Full pricing breakdown", href: "https://app.theobeliskstudio.com/pricing" }

faq:
  kicker: "09 · FAQ"
  heading: "Things people ask before they buy."
  items:
    - q: "How is this different from StudioBinder / Yamdu / Croogloo?"
      a: "Those tools are databases. Grace is a workflow. Your script change cascades to your call sheet automatically; their schedule pages don't talk to their call sheet pages. We also enforce union compliance at the point of decision, not at the audit. And every value carries a dot showing who decided it — humans, not the software, own the production."
    - q: "Can my whole crew use it, or just production?"
      a: "Whole crew. Seat tiers are T1 (producer / UPM / tier-1 other), T2 (director / 1st AD / DP / department heads), T3 (crew + cast). Standard includes 28 seats out of the box; Studio includes 56. Pack-add-ons extend further. T3 sees only their day, their call, their own time card — never the budget."
    - q: "What happens to my data if I cancel?"
      a: "Read-only access through the end of the billing period. Export every artifact (PDFs, CSVs, EDL, FCPXML) before then. After that, we retain your data for 30 days in case you reactivate, then deletion runs on schedule per the Privacy Policy."
    - q: "Does it handle weekly TV or multi-block episodics?"
      a: "Today, Grace is optimized for a single production at a time. Multi-block / weekly TV is on the roadmap. If that's your shape, reach out — we'd like to talk before we build it."
    - q: "What about SAG Ultra Low Budget / Short Project Agreement?"
      a: "Standard SAG-AFTRA thresholds today. SAG tier-specific variants (Low Budget, Ultra Low Budget, Short Project Agreement) are scoped for the next compliance release."
    - q: "Can I run this on a script I haven't shared with anyone yet?"
      a: "Yes. Scripts live in your private org. Per-section access controls mean a confidential script can be uploaded by the producer and stay locked from the rest of the org until it's broken down and shared. The Vault adds another layer: magic-link sharing with watermarking and device locking when you do need to send something out."
    - q: "Are you self-hosted or SaaS?"
      a: "SaaS, hosted on Railway + Neon (US-East) with Cloudflare R2 for object storage. Self-hosted for enterprise is on the table — get in touch if that's a hard requirement."
    - q: "Who's behind it?"
      a: "Obelisk Studios — Kshitij Kapil (working DP / colorist) and Siddharth Agrawal. A real, small, working studio. Burbank, California."

finalCta:
  heading: "Grace is open to a small beta cohort right now."
  body: "Tell us about your production — title, format, shoot dates, union status — and we'll get you set up."
  primary: { label: "Request beta access", href: "/contact?topic=Grace" }
  secondary: { label: "See the basic overview", href: "/grace" }
