# Terms of Service — Sid and KK can edit via Decap. Each section
# corresponds to one block on the rendered /terms page. The schema
# in src/lib/schema.ts is what the prebuild validator enforces.

hero:
  eyebrow: Legal
  title: Terms of Service
  lastUpdated: June 27, 2026
  intro: |
    These terms govern your use of Grace Production OS, the software product operated by Obelisk Studio. By signing in to an account, paying for a subscription, or otherwise using Grace, you agree to be bound by these terms.

    They're long but real: they cover what we promise, what you promise, how the relationship is paid for, what happens if something goes wrong, and how disputes get resolved.

sections:
  - heading: Who is agreeing to what
    body: |
      These terms form a binding contract between you and Obelisk Studio. If you sign up on behalf of a production company, studio, or other organization, you represent that you have the authority to bind that entity, and references to "you" in these terms mean both you individually and the organization you represent.

      We refer to Obelisk Studio as "we," "us," or "our" throughout.

  - heading: The service
    body: |
      Grace is a software-as-a-service platform for managing film and television production. We provide hosted tools for call sheets, schedules, budgets, scripts, dailies, screeners, cast and crew records, and related production workflows.

      The features available to you depend on your subscription plan. Current plans, prices, and feature breakdowns are published at app.theobeliskstudio.com/pricing.

  - heading: Beta program
    body: |
      Grace is currently offered as a free beta. During the beta period, access to Grace is provided at no charge, we do not collect a payment method, and we do not bill you for use of the service. Notwithstanding any other provision of these terms (including the "Subscriptions, billing, and changes", "Automatic renewal disclosures (California subscribers and ROSCA)", and "Promotional trials and beta codes" sections and the Refund Policy), while your account is a beta account no payment method is collected, no fee or subscription charge applies, and no trial conversion or automatic renewal occurs.

      Beta software is provided on an "as is" and "as available" basis. Features may change, and the service or the beta program may be modified, suspended, or discontinued at any time. The warranty disclaimers and the limitation of liability set out in these terms apply in full to your use of the beta.

      We may introduce paid plans in the future. If we do, we will give you at least 60 days' advance notice before any charge takes effect, and you will choose whether to subscribe. We will never convert a beta account to a paid subscription automatically, and we will never charge you without your affirmative agreement to a paid plan. If you choose not to subscribe when the beta ends, your access may become read-only or may end. We will give you a reasonable opportunity to export your data before any account is closed.

      The free beta is currently available to US-based individuals or companies.

  - heading: Eligibility and account
    body: |
      You must be at least 18 years old, or the legal age of majority in your jurisdiction if higher, to enter into this agreement.

      You agree to provide accurate, current, and complete information when you create your account, and to keep that information up to date. You are responsible for the security of your sign-in credentials and for all activity that occurs under your account. Notify us promptly at security@theobeliskstudio.com if you suspect unauthorized access.

  - heading: Subscriptions, billing, and changes
    body: |
      Grace is sold as a monthly or annual subscription. Subscriptions auto-renew at the end of each billing period unless cancelled.

      Payment is processed by Stripe, our payment provider. Their terms apply to the payment process itself; we do not store your card details.

      Upgrades, downgrades, and add-on changes prorate against your current billing period. The math is computed by Stripe at the moment of change.

      If a payment fails, we will attempt recovery in line with Stripe's standard retry schedule. After a defined grace period (currently seven days), your account moves to read-only access until payment is restored.

      We may change subscription prices on at least 30 days' notice before they apply to your renewal. Existing subscriptions continue at their current rate until renewal.

  - heading: Automatic renewal disclosures (California subscribers and ROSCA)
    body: |
      Grace subscriptions, including those that begin with a free trial, automatically renew at the rate disclosed at sign-up. This section sets out the specific disclosures required by California Business & Professions Code §§17600 et seq. (the California Automatic Renewal Law) and the federal Restore Online Shoppers' Confidence Act ("ROSCA").

      *What auto-renews and at what price.* Each plan renews monthly or annually, at the current price shown on the plan card at sign-up, until you cancel. For trials longer than 31 days (the 90-day Founders' Beta), the trial converts automatically to a paid subscription at the disclosed price unless you cancel before the trial ends.

      *Affirmative consent.* Before the first charge, we present a dedicated acknowledgment that displays the renewal date, the renewal amount, and the cancellation mechanism. You must check that acknowledgment separately from your acceptance of these Terms of Service in order to start a trial or subscription.

      *Post-signup confirmation.* Immediately after you start a subscription or trial, we send a confirmation email to the address on your account that repeats the renewal date, the renewal amount, and a direct link to cancel.

      *Pre-renewal reminder.* For trials longer than 31 days, we send a reminder email between 3 and 21 days before the first charge (currently scheduled at 7 days before), repeating the charge amount and the cancellation link.

      *How to cancel.* You can cancel any subscription or trial online, at any time, without contacting support, in Settings → Billing inside Grace. The cancel control is at least as easy to find and use as the sign-up flow. You may also email finance@theobeliskstudio.com.

      *California rights.* California subscribers may exercise their cancellation rights under California Business & Professions Code §17600 et seq., which this section is designed to satisfy.

  - heading: Refunds
    body: |
      Cancellations end your subscription at the close of the current period; we do not refund the unused portion of a paid period.

      If you believe you were charged in error (for example, a duplicate charge, a charge after a successful cancellation, or a charge on a closed account), email finance@theobeliskstudio.com within 30 days of the charge and we will review the case. Where we agree we charged in error, we will refund the disputed amount through the original payment method.

      For promotional trials that auto-convert to paid subscriptions, the conversion charge follows the same rule: cancel before the trial ends to avoid the charge; once the charge is processed, the no-refund-of-unused-portion rule applies to the converted period.

  - heading: Acceptable use
    body: |
      You agree not to use Grace to:

      *Violate the law,* infringe anyone's intellectual property or other rights, defame, harass, or harm anyone.

      *Upload content* that is unlawful, deceptive, sexually exploitative of minors, glorifies violence, or that you do not have the right to upload.

      *Interfere with the service* through automated scraping at a rate that degrades availability, unauthorized penetration testing, attempts to bypass access controls, reverse engineering (except as permitted by mandatory law), or unauthorized resale of access.

      *Misuse confidentiality features,* for example, using the Vault screener share flow to distribute material you are not authorized to distribute.

      We may suspend or terminate accounts that materially violate this section. Where reasonable, we will notify you and give you a chance to cure.

  - heading: Your content
    body: |
      Everything you upload to Grace (scripts, schedules, budgets, cast and crew records, dailies, screeners, photos, call sheets, deal memos, and any other materials) *belongs to you.* You retain full ownership and intellectual property rights in your content. We claim no ownership.

      To operate the service, you grant Obelisk Studio a limited, non-exclusive, royalty-free license to host, store, transmit, process (including through the AI subprocessors named in our Privacy Policy), display, and deliver your content for the sole purpose of providing Grace to you and the people you have authorized through Grace's access controls.

      This license is co-extensive with your need for the service: it ends when you delete the content, close your account, or instruct us to stop processing, subject to the retention timelines described in the Privacy Policy and any legal obligations we may have to retain records (e.g., financial records for tax purposes).

  - heading: Confidentiality
    body: |
      Production materials (particularly unproduced scripts, cast contact information, deal terms, and dailies) carry industry-standard confidentiality expectations. Obelisk Studio treats all content you upload as confidential.

      We do not disclose user content to third parties except:

      *To the subprocessors named in our Privacy Policy,* and only to the minimum extent necessary to operate the service.

      *Where required by valid legal process,* in which case we will notify you of the request prior to disclosure unless we are legally prohibited from doing so.

      *Where you instruct us to* through Grace's sharing features (e.g., emailing a call sheet, sharing a screener via Vault, inviting a collaborator).

  - heading: AI features and output
    body: |
      Grace processes AI tasks — script parsing, scene breakdown generation, VFX-shot suggestions, and conversational assistance through the Grace AI panel — primarily through Amazon Bedrock (Anthropic Claude and related models, hosted within AWS), with Google Cloud Vertex AI (Gemini) and the Anthropic and Google direct APIs as failovers.

      AI output is *generated, not human-authored.* It can be inaccurate, incomplete, or inconsistent. It is not legal, medical, financial, accounting, employment, or other professional advice. You remain responsible for reviewing AI output before relying on it. To the maximum extent permitted by applicable law, we disclaim all warranties of accuracy, completeness, and fitness for purpose with respect to AI-generated content.

      Grace's Dot System (the colored-dot trust indicators on every field) is designed precisely so that AI-suggested values remain visibly distinguishable from human-verified ones: *blue* dots mark Grace-suggested or AI-inferred content, *gold* dots mark human-entered content, and *green* dots mark content verified from a signed document. Treat blue-dot fields as drafts to be reviewed, not as authoritative.

  - heading: Promotional trials and beta codes
    body: |
      From time to time we offer promotional sign-up codes (including, currently, the 90-day Founders' Beta) that grant a longer free trial than the default. The mechanics of each promotion are disclosed at the moment you redeem the code: trial length, the post-trial price, the renewal cadence, and eligibility.

      Promotional trials auto-convert to paid subscriptions at the disclosed price on the disclosed date unless you cancel before then. The acknowledgment, confirmation, and pre-renewal reminder requirements described under "Automatic renewal disclosures" above apply to promotional trials in the same way they apply to ordinary subscriptions.

      We may withdraw a promotion, change its terms, or refuse a code that has been issued in error or used in violation of the promotion's published rules. Where you have already signed up under an earlier set of promotional terms, those earlier terms continue to apply to your subscription through the end of the current promotional period.

  - heading: Beta features
    body: |
      Features labeled "beta," "preview," "early access," or similar are made available on an as-is basis. They may behave unpredictably, change without notice, or be withdrawn entirely. Beta features are excluded from any service-level commitment we may otherwise make, and from the AI accuracy expectations described above.

  - heading: Third-party services
    body: |
      Grace integrates with third-party services to deliver parts of its functionality: payment processing through Stripe, email delivery through Resend, file storage through Cloudflare R2, AI processing through Amazon Bedrock (with Anthropic and Google as failovers), weather data through Open-Meteo, geocoding through Google Maps Platform and OpenStreetMap, product-usage analytics through PostHog (US-hosted), and others enumerated in our Privacy Policy.

      Your use of those third-party services is governed by their respective terms in addition to these. We are not responsible for the availability, accuracy, or behavior of third-party services.

  - heading: Our intellectual property
    body: |
      Grace's software, source code, design, branding (including the names "Grace," "Grace Production OS," "Obelisk Studio," and related marks and logos), and documentation are the intellectual property of Obelisk Studio.

      During your active subscription, we grant you a non-transferable, non-sublicensable, non-exclusive right to access and use Grace for your production needs. No other rights are granted, expressly or by implication. You agree not to copy, modify, decompile, or create derivative works of Grace except as expressly permitted by these terms or by mandatory law.

  - heading: Term and termination
    body: |
      These terms apply for as long as you have an account with us. You may close your account at any time through Settings. Your subscription will end at the close of the current billing period and your data will be handled per the Privacy Policy's retention schedule.

      We may suspend or terminate your account if you materially breach these terms, if your payment fails after the grace period described above, or if continued operation would create undue legal or operational risk for us. Where reasonable, we will notify you in advance and give you an opportunity to cure.

      On termination by either party, your access to Grace ends, billing stops at the end of the then-current period, and your data is retained or deleted per the Privacy Policy. Sections of these terms that by their nature should survive termination survive: Your Content (the license you granted us, to the extent we still hold data), Confidentiality, Intellectual Property, Disclaimers, Limitation of Liability, Indemnification, Governing Law.

  - heading: Copyright complaints and DMCA agent
    body: |
      Obelisk Studio respects the intellectual property rights of others and expects users of Grace to do the same. We respond to notices of alleged copyright infringement that comply with the U.S. Digital Millennium Copyright Act ("DMCA"), 17 U.S.C. §512.

      *How to send a notice.* If you believe content stored or transmitted through Grace infringes a copyright you own or are authorized to enforce, send a notice to our designated agent that includes (a) a physical or electronic signature of the rights-holder or authorized representative, (b) identification of the copyrighted work claimed to be infringed, (c) identification of the allegedly infringing material with enough detail for us to locate it, (d) your contact information, (e) a statement that you have a good-faith belief that the use is not authorized, and (f) a statement, under penalty of perjury, that the information in the notice is accurate and that you are authorized to act on the rights-holder's behalf.

      *Designated agent and the formal process.* Our designated agent contact and the formal DMCA filing instructions are published at theobeliskstudio.com/dmca. We have registered the agent with the United States Copyright Office under 17 U.S.C. §512(c)(2).

      *Counter-notification.* If your content was removed in response to a notice and you believe the removal was a mistake or misidentification, you may file a counter-notification under 17 U.S.C. §512(g). The procedure is described on the same page.

      *Repeat infringers.* In appropriate circumstances, and at our sole discretion, we will terminate the accounts of users who repeatedly receive DMCA notices we determine to be valid.

  - heading: Force majeure
    body: |
      We are not liable for any delay or failure to perform under these terms caused by events outside our reasonable control, including but not limited to: failures, outages, or capacity limits of upstream service providers (cloud, AI, payment, email, storage, network, DNS); acts of government, court orders, or regulatory action; war, civil unrest, terrorism, or cyberattack; pandemic, natural disaster, fire, flood, or extreme weather; labor disputes affecting us or our providers; and material disruption to the public internet.

      Where reasonably possible, we will notify affected subscribers of a material outage and resume service as soon as the cause is resolved. If a force majeure event materially disables the service for more than thirty consecutive days, either party may terminate this agreement on written notice without further liability beyond payment of fees accrued before the event.

  - heading: Export controls and sanctions
    body: |
      You represent and warrant that you are not located in, ordinarily resident in, or a national of a country or territory subject to comprehensive U.S. economic sanctions (currently including Cuba, Iran, North Korea, Syria, the Crimea region of Ukraine, and the so-called Donetsk and Luhansk People's Republics), and that you are not identified on the U.S. Treasury Department's Office of Foreign Assets Control ("OFAC") Specially Designated Nationals list or any equivalent denied-parties or sanctions list maintained by the United States, the European Union, the United Kingdom, or the United Nations.

      You agree not to use Grace, and not to permit any third party under your control to use Grace, in violation of any applicable export-control or sanctions law, including the U.S. Export Administration Regulations and the regulations administered by OFAC. We may suspend or terminate accounts that we determine, in good faith, are operated in violation of this section.

  - heading: Disclaimers
    body: |
      Grace is provided *"as is"* and *"as available,"* without warranties of any kind, whether express or implied, including any warranties of merchantability, fitness for a particular purpose, title, non-infringement, accuracy, or that the service will be uninterrupted, secure, error-free, or that any data will be preserved.

      To the maximum extent permitted by applicable law, all implied warranties are disclaimed. Some jurisdictions do not allow the exclusion of implied warranties; in those jurisdictions, the exclusions in this section apply to the maximum extent permitted by law.

  - heading: Limitation of liability
    body: |
      *To the maximum extent permitted by applicable law*, Obelisk Studio's aggregate liability for any and all claims arising out of or relating to these terms or your use of Grace will not exceed the amount you paid us in the twelve months immediately preceding the event giving rise to the claim, or $100 if you have paid us less than that.

      We will not be liable for indirect, incidental, consequential, special, exemplary, or punitive damages, lost profits, lost revenue, lost data, business interruption, or loss of goodwill, even if we have been advised of the possibility of those damages.

      Some jurisdictions do not allow these limitations; in those jurisdictions, our liability is limited to the maximum extent permitted by law. This section does not limit liability for fraud, gross negligence, or any liability that cannot be limited by law.

  - heading: Indemnification
    body: |
      You agree to defend, indemnify, and hold harmless Obelisk Studio and its officers, employees, and agents from any third-party claim, demand, loss, liability, damage, or expense (including reasonable attorneys' fees) arising out of (a) content you upload to or share through Grace, (b) your breach of these terms, or (c) your violation of any law or any right of a third party.

      We will promptly notify you of any such claim, give you reasonable cooperation in the defense, and allow you to control the defense, provided you do not settle the matter in a way that imposes obligations on us without our written consent.

  - heading: Governing law and dispute resolution
    body: |
      These terms are governed by the laws of the State of California, without regard to its conflict-of-laws principles. Any dispute arising out of or relating to these terms or your use of Grace will be resolved exclusively in the state or federal courts located in Los Angeles County, California, and you consent to the personal jurisdiction of those courts.

      Nothing in this section limits non-waivable consumer protection rights you may have under the law of your jurisdiction of residence.

  - heading: Changes to these terms
    body: |
      We may update these terms as Grace evolves, as new features ship, or as laws change. The "Last updated" date at the top of this page always reflects the current version.

      Material changes (anything that meaningfully alters the rights and obligations described here) will be communicated by email to active account holders at least 14 days before the changes take effect. Continued use of Grace after the effective date constitutes acceptance of the updated terms. If you do not accept the updates, you may close your account before the effective date and the prior terms will continue to apply to your historical use.

  - heading: Miscellaneous
    body: |
      *Entire agreement.* These terms, together with the Privacy Policy and any plan-specific terms presented at checkout, constitute the entire agreement between you and Obelisk Studio with respect to Grace, and supersede any prior agreements on the same subject.

      *Severability.* If any provision is held unenforceable, the remaining provisions remain in effect, and the unenforceable provision will be modified to the minimum extent necessary to make it enforceable while preserving its intent.

      *No waiver.* Our failure to enforce any provision is not a waiver of our right to do so later.

      *Assignment.* You may not assign these terms without our prior written consent. We may assign these terms to an affiliate or in connection with a merger, acquisition, or sale of all or substantially all of our assets, on notice to you.

      *Notices.* We may send notices to you by email at the address associated with your account. You may send notices to us at legal@theobeliskstudio.com.

      *Headings.* Section headings are for convenience only and do not affect interpretation.

      *Language.* If we provide a translation of these terms, the English version controls in case of conflict.

contact:
  heading: Contact
  body: |
    Questions about these terms, or about anything legal-adjacent, go to the address below. For general support, billing, or product questions, use the contact form at theobeliskstudio.com/contact instead.
  email: legal@theobeliskstudio.com
