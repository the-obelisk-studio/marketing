studio:
  kicker: The Studio
  heading: "Built by *filmmakers*, for the work."
  body: |
    Obelisk was founded by Kshitij Kapil, a working filmmaker tired of using software made for everyone except the people on set. The studio operates in partnership with TDH Systems, who lead the technical build behind Grace. Every choice begins with the question, *would we use this on our own production?* If the answer is no, we don't ship it.

    A film moves in stages: development, prep, production, post. Most tools and most studios live in one of those stages and pretend the others don't exist. We've worked all of them. Obelisk is built from that understanding — that what gets decided in development shapes what's possible in color, that what gets shot on day one matters in the edit suite three months later, that the picture is one continuous thing from page to final frame.

    And we work *with* people, not for them. Software is a co-pilot, never an autopilot. Finishing runs as a collaboration with the DP, the director, and the editor — not a black box that returns a master. The studio is built around a single conviction across both pillars: the work is better when the people doing it are working together.
  links: []

offerings:
  kicker: What We Make
  heading: "Software. *Finishing.*"
  items:
    - kicker: I · Software
      status: In Development
      statusKind: active
      title: Grace
      tagline: A production operating system.
      blurb: |
        Grace is built around one idea: every department on a film should be working from the same picture. Breakdown feeds schedule. Schedule feeds budget. Budget feeds call sheet. Everything connects, nothing gets re-entered, and no one is working from a stale version. The smart parts are baked in — co-pilot, never autopilot. Filmmakers stay in command.
      href: /grace
      cta: Learn more
    - kicker: II · Services
      status: In Planning
      statusKind: future
      title: Post Production
      tagline: Edit, color, and finishing.
      blurb: |
        A finishing house run by working filmmakers. Editorial and color anchor the work — supervised by DPs and editors who care about the picture as a whole, not as a queue of timelines to push through. Sound design and mix are next; we're locking in collaborators now. Built for indie features, documentaries, and short-form work that deserves to be finished with care — not pushed through a render queue.
      href: /post
      cta: View finishing

