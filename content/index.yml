studio:
  kicker: The Studio
  heading: Built by *filmmakers*, for the work.
  body: >
    Obelisk was founded by Kshitij Kapil, a working filmmaker tired of using
    software made for everyone except the people on set. The studio operates in
    partnership with TDH Systems, who lead the technical build behind Grace.
    Every choice begins with the question, *would we use this on our own
    production?* If the answer is no, we don't ship it.


    A film moves in stages: development, prep, production, post. Most tools and most studios live in one of those stages and pretend the others don't exist. We've worked all of them. Obelisk is built from that understanding: what gets decided in development shapes what's possible in color, what gets shot on day one matters in the edit suite three months later, the picture is one continuous thing from page to final frame.


    And we work *with* people, not for them. Software is a co-pilot, never an autopilot. Finishing runs as a collaboration with the DP, the director, and the editor, not a black box that returns a master. The studio is built around a single conviction across both pillars: the work is better when the people doing it are working together.
  links: []
